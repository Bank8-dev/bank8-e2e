<svg viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Square background (optional, white) -->
  <rect x="0" y="0" width="64" height="64" fill="white" />

  <!-- Lowercase i -->
  <text x="1" y="60"
        font-family="Arial, sans-serif"
        font-size="80"
        fill="blue">
    i
  </text>

  <!-- Capital B -->
  <text x="12" y="60"
        font-family="Arial, sans-serif"
        font-size="80"
        fill="blue">
    B
  </text>
</svg>
